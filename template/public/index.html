<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>和 Grok 聊天</title>
    <meta
      name="description"
      content="使用 4 位分享口令，和家人分享的 Bot 聊天。"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="access-screen" class="access-screen" aria-labelledby="access-title">
        <div class="bot-identity bot-identity--access">
          <img
            class="bot-avatar bot-avatar--large"
            data-bot-avatar
            src="/bot-avatar.svg"
            alt=""
            width="80"
            height="80"
          />
          <h1 id="access-title" data-bot-name>Grok</h1>
          <p>输入分享口令</p>
        </div>

        <form id="access-form" class="access-form" autocomplete="off">
          <fieldset>
            <legend class="sr-only">4 位分享口令</legend>
            <div id="passcode-fields" class="passcode-fields">
              <input
                data-pass-index="0"
                aria-label="口令第 1 位"
                autocomplete="one-time-code"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                type="text"
              />
              <input
                data-pass-index="1"
                aria-label="口令第 2 位"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                type="text"
              />
              <input
                data-pass-index="2"
                aria-label="口令第 3 位"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                type="text"
              />
              <input
                data-pass-index="3"
                aria-label="口令第 4 位"
                inputmode="numeric"
                maxlength="1"
                pattern="[0-9]"
                type="text"
              />
            </div>
          </fieldset>
          <button class="sr-only" type="submit">进入聊天</button>
          <p id="access-status" class="access-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section id="chat-screen" class="chat-screen" aria-label="聊天" hidden>
        <header class="chat-header">
          <div class="bot-identity bot-identity--header">
            <img
              class="bot-avatar bot-avatar--header"
              data-bot-avatar
              src="/bot-avatar.svg"
              alt=""
              width="36"
              height="36"
            />
            <div>
              <strong data-bot-name>Grok</strong>
              <span>Bot</span>
            </div>
          </div>
        </header>

        <div id="message-list" class="message-list" aria-live="polite" aria-relevant="additions text">
          <div id="empty-state" class="empty-state">
            <img
              class="bot-avatar bot-avatar--empty"
              data-bot-avatar
              src="/bot-avatar.svg"
              alt=""
              width="48"
              height="48"
            />
            <strong>有什么想问的？</strong>
          </div>
        </div>

        <div id="status-line" class="sr-only" role="status" aria-live="polite"></div>

        <form id="message-form" class="composer" autocomplete="off">
          <label class="sr-only" for="question-input">输入消息</label>
          <textarea
            id="question-input"
            name="question"
            rows="1"
            maxlength="1000"
            placeholder="问点什么"
            required
          ></textarea>
          <button id="send-button" type="submit" aria-label="发送消息">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 19V5m0 0-6 6m6-6 6 6" />
            </svg>
          </button>
        </form>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
